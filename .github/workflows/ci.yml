name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build · Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: storage is node:sqlite precisely
        # so installs never need a native toolchain, and that claim is worth
        # proving on every commit.
        os: [ubuntu-latest, windows-latest]
        # 22.13 is the floor, not 22.5: node:sqlite landed in 22.5 but stayed
        # behind --experimental-sqlite until 22.13, so an unflagged import
        # throws ERR_UNKNOWN_BUILTIN_MODULE on anything older.
        node: ['22.13', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # A single registry GET. Cheap, and it is the only thing standing between
      # the README's install instruction and a package somebody else controls.
      - name: Verify the npm name is ours
        run: npm run verify:name

      - name: Typecheck
        run: npm run typecheck

      # Runs on every matrix leg rather than once: the suite exercises
      # node:sqlite and the filesystem directly, which are exactly the things
      # that differ between Windows and Linux.
      - name: Test
        run: npm run test:run

      # Cheap: no toolchain download, no packaging. Catches a missing icon, a
      # syntax error in the shell, or the renderer hardening flags being turned
      # off — all of which previously only surfaced when someone built an
      # installer by hand. The real packaging run lives in desktop.yml.
      - name: Verify desktop packaging
        run: npm run verify:electron

      - name: Build
        run: npm run build

      # The one check nothing else covered: install the packed artefact into a
      # throwaway global prefix and run the command a user types. Everything else
      # in this file runs against the repository, which is why a README telling
      # people to install a package we did not own stayed green for three
      # releases.
      - name: Verify a global install produces a working command
        run: npm run verify:install

      - name: Boot the gateway and probe it
        shell: bash
        run: |
          npx next start -p 7272 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7272/api/system/status || true)
            [ "$code" = "200" ] && break
            sleep 2
          done

          # A build that compiles but cannot serve /v1/models is not a build.
          curl -fsS http://127.0.0.1:7272/api/system/status > /dev/null
          curl -fsS http://127.0.0.1:7272/v1/models > /dev/null
          curl -fsS -X POST http://127.0.0.1:7272/api/system/bootstrap > /dev/null
          echo "gateway responded on all smoke endpoints"
